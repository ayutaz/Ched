name: Build and Release

on:
  push:
    branches: [ main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [ main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # WPFアプリケーションのため

    steps:
      - uses: actions/checkout@v4.2.2

      # Visual Studioと.NET Framework SDKのセットアップ(x86サポート用)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      # .NET SDKのインストール      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            9.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.1
        with:
          nuget-version: 'latest'

      # packages.configスタイルのパッケージ復元
      - name: Restore NuGet packages
        run: |
          nuget restore Ched.sln

      # x86アーキテクチャを指定してビルド
      - name: Build Application for x86
        run: |
          msbuild Ched.sln /p:Configuration=Release /p:Platform=x86 

      - name: Create release folder
        run: |
          mkdir ChedRelease

      # 正確なパスからファイルをコピー
      - name: Copy files to release folder
        run: |
          # 確認されたパスからChed.exeをコピー
          cp "Ched/bin/x86/Release/Ched.exe" "ChedRelease/"
          
          # 依存関係のあるDLLも全てコピー
          cp "Ched/bin/x86/Release/*.dll" "ChedRelease/"
          cp "Ched/bin/x86/Release/*.config" "ChedRelease/"
          
          # bassdllをコピー
          cp "Ched/bin/x86/Release/bass*.dll" "ChedRelease/"
          
          # 音楽ファイル
          cp "Ched/bin/x86/Release/*.mp3" "ChedRelease/" || echo "No mp3 files"
          
          # Addonフォルダをコピー
          mkdir -p "ChedRelease/Addon"
          cp "Ched/bin/x86/Release/Addon/*" "ChedRelease/Addon/" || echo "No addon files"
          
          # 必要な追加ファイル
          cp "LICENSE.txt" "README.md" "ChedRelease/" || echo "Some documentation files may not exist"
        shell: pwsh

      - name: Verify Ched.exe exists
        run: |
          if (Test-Path "ChedRelease/Ched.exe") {
            Write-Host "Ched.exe successfully copied to release folder"
          } else {
            Write-Error "Ched.exe not found in release folder!"
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path "ChedRelease/*" -DestinationPath "Ched-Release.zip" -Force
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Ched-Release
          path: |
            ChedRelease/
            Ched-Release.zip

      # タグプッシュ時のみリリース作成
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: |
            Ched-Release.zip
          name: Release ${{ github.ref_name }}
          body: |
            # Ched リリース ${{ github.ref_name }}
            
            ## インストール方法
            1. `Ched-Release.zip` をダウンロードして解凍
            2. 解凍したフォルダ内の `Ched.exe` を実行してください
            
            ## 注意事項
            * このアプリケーションには多数の依存ファイルが必要です
            * 全てのファイルを同じフォルダに配