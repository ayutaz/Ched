name: Build and Release

on:
  push:
    branches: [ main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [ main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # WPFアプリケーションのため

    steps:
      - uses: actions/checkout@v4.2.2

      # Visual Studioと.NET Framework SDKのセットアップ(x86サポート用)
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      # .NET SDKのインストール      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            9.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.1
        with:
          nuget-version: 'latest'

      # packages.configスタイルのパッケージ復元
      - name: Restore NuGet packages (packages.config)
        run: |
          nuget restore Ched.sln

      # 新しいスタイルのパッケージ復元
      - name: Restore dependencies (.NET Core style)
        run: dotnet restore

      # x86アーキテクチャを指定して単一ファイル発行ビルド
      - name: Build Single File Application for x86
        run: |
          msbuild Ched/Ched.csproj /t:Publish /p:Configuration=Release /p:Platform=x86 /p:PublishProfile=FolderProfile /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create release folder
        run: |
          mkdir ChedRelease

      - name: Copy files to release folder
        run: |
          # ビルド出力を探してデバッグ表示
          dir Ched/bin/ -Recurse
          
          # 出力ファイルをコピー (様々なパターンを試す)
          cp Ched/bin/x86/Release/*/publish/Ched.exe ChedRelease/ || echo "Path 1 failed"
          cp Ched/bin/Release/x86/*/publish/Ched.exe ChedRelease/ || echo "Path 2 failed"
          cp Ched/bin/x86/Release/Ched.exe ChedRelease/ || echo "Path 3 failed"
          cp Ched/bin/Release/Ched.exe ChedRelease/ || echo "Path 4 failed"
          
          # ビルド出力ディレクトリから直接コピー（最終手段）
          dir Ched/bin/ -Recurse | Where-Object { $_.Name -eq "Ched.exe" } | ForEach-Object {
            Write-Host "Found Ched.exe at: $($_.FullName)"
            cp $_.FullName ChedRelease/
          }
          
          # 必要な追加ファイル
          cp LICENSE.txt README.md ChedRelease/ || echo "Some documentation files may not exist"
        shell: pwsh

      - name: Check if Ched.exe exists
        run: |
          if (Test-Path ChedRelease/Ched.exe) {
            Write-Host "Ched.exe successfully copied to release folder"
          } else {
            # 最後の手段：ビルド出力ディレクトリの内容をすべてコピー
            Get-ChildItem -Path Ched/bin/x86/Release/ -Recurse | Where-Object { !$_.PSIsContainer } | ForEach-Object {
              $targetPath = Join-Path -Path "ChedRelease" -ChildPath $_.Name
              Copy-Item -Path $_.FullName -Destination $targetPath -Force
              Write-Host "Copied $($_.Name) to release folder"
            }
          
            Write-Host "Failed to find Ched.exe, copied all files from release directory instead"
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path ChedRelease/* -DestinationPath Ched-Release.zip -Force
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.1
        with:
          name: Ched-Release
          path: |
            ChedRelease/
            Ched-Release.zip

      # タグプッシュ時のみリリース作成
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: |
            Ched-Release.zip
          name: Release ${{ github.ref_name }}
          body: |
            # Ched リリース ${{ github.ref_name }}
            
            ## インストール方法
            1. `Ched-Release.zip` をダウンロードして解凍
            2. 解凍したフォルダ内の `Ched.exe` を実行するだけで利用できます
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}